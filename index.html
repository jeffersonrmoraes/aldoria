<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reinos de Aldoria</title>
  <style>
    :root { --bg:#14101c; --panel:#221b30; --panel2:#2d2440; --line:#5b4a82; --txt:#eee8ff; --dim:#a79cc4; --gold:#f1c40f; --hp:#d9453d; --en:#3b82f6; --xp:#a855f7; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:#000; color:var(--txt); font-family:'Trebuchet MS',Verdana,sans-serif; overflow:hidden; user-select:none; }
    #app { position:relative; width:100vw; height:100vh; }
    #game { position:absolute; inset:0; }
    #game canvas { display:block; outline:none; }
    #labels { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
    .lb { position:absolute; left:0; top:0; font-size:12px; font-weight:bold; text-shadow:1px 1px 2px #000,-1px -1px 2px #000,1px -1px 2px #000,-1px 1px 2px #000; white-space:nowrap; text-align:center; color:#fff; will-change:transform; }
    .lb .hb { width:56px; height:6px; background:#000b; border:1px solid #000; margin:2px auto 0; border-radius:3px; overflow:hidden; }
    .lb .hb i { display:block; height:100%; width:100%; background:#d9453d; }
    .ft { position:absolute; transform:translate(-50%,-50%); font-weight:bold; font-family:'Trebuchet MS',Verdana,sans-serif; text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000; animation:rise .95s ease-out forwards; white-space:nowrap; }
    @keyframes rise { 0% { opacity:1; margin-top:0; scale:.7 } 15% { scale:1.15 } 100% { opacity:0; margin-top:-56px; scale:1 } }
    #ui { position:absolute; inset:0; pointer-events:none; }
    #ui .hit { pointer-events:auto; }
    .hidden { display:none !important; }
    .panel { background:var(--panel); border:2px solid var(--line); border-radius:6px; box-shadow:0 4px 0 #0008; }
    .bar { height:12px; background:#0008; border:1px solid #000; border-radius:3px; overflow:hidden; position:relative; }
    .bar > i { position:absolute; inset:0 auto 0 0; width:50%; }
    .bar span { position:absolute; inset:0; font-size:9px; text-align:center; line-height:12px; text-shadow:1px 1px #000; }
    button { font:inherit; color:var(--txt); background:var(--panel2); border:2px solid var(--line); border-radius:5px; padding:6px 12px; cursor:pointer; }
    button:hover:not(:disabled) { background:#3b2f57; border-color:#8a73c4; }
    button:disabled { opacity:.45; cursor:default; }
    button.primary { background:#5b3fb0; border-color:#9d85ee; font-weight:bold; }
    .screen { position:absolute; inset:0; background:radial-gradient(ellipse at center,#2b2147 0%,#0d0a14 80%); display:flex; align-items:center; justify-content:center; pointer-events:auto; overflow:auto; }
    .title { text-align:center; }
    .title h1 { font-size:46px; margin:0 0 4px; letter-spacing:3px; color:var(--gold); text-shadow:0 4px 0 #6b4a00, 0 0 24px #f1c40f55; }
    .title h2 { margin:0 0 28px; color:var(--dim); font-weight:normal; }
    .title button { display:block; margin:10px auto; width:260px; padding:12px; font-size:16px; }
    /* ===== Tela inicial temática D&D ===== */
    .tscreen { position:absolute; inset:0; overflow:auto; pointer-events:auto; background:linear-gradient(#07051a 0%,#1a1038 45%,#3a1a3c 72%,#5a2a2a 100%); font-family:Georgia,'Palatino Linotype','Book Antiqua',serif; }
    .tscreen .sky { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
    .tscreen .stars { position:absolute; inset:0; background-image:radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 30% 8%,#fff,transparent),radial-gradient(1.5px 1.5px at 52% 22%,#ffe9a8,transparent),radial-gradient(1px 1px at 70% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 88% 26%,#fff,transparent),radial-gradient(1px 1px at 20% 34%,#fff,transparent),radial-gradient(1px 1px at 62% 38%,#fff,transparent),radial-gradient(1.5px 1.5px at 94% 6%,#fff,transparent),radial-gradient(1px 1px at 42% 30%,#fff,transparent); animation:twinkle 4s ease-in-out infinite alternate; }
    .tscreen .moon { position:absolute; right:12%; top:9%; width:90px; height:90px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#fffbe8,#e8dcae 60%,#b9a96f); box-shadow:0 0 60px 20px #ffe9a855; }
    .tscreen .dragon { position:absolute; top:16%; left:-120px; width:110px; opacity:.85; animation:fly 38s linear infinite; }
    .tscreen .land { position:absolute; left:0; right:0; bottom:0; width:100%; height:42%; }
    .tscreen .ember { position:absolute; bottom:-10px; width:4px; height:4px; border-radius:50%; background:#ffb347; box-shadow:0 0 8px 2px #ff8a1f; opacity:0; animation:rise linear infinite; }
    @keyframes twinkle { from{opacity:.55} to{opacity:1} }
    @keyframes fly { from{transform:translateX(0) translateY(0)} 50%{transform:translateX(60vw) translateY(-30px)} to{transform:translateX(calc(100vw + 240px)) translateY(10px)} }
    @keyframes rise { 0%{transform:translate(0,0);opacity:0} 10%{opacity:.9} 100%{transform:translate(var(--dx,30px),-70vh);opacity:0} }
    @keyframes spin20 { to{transform:rotateY(360deg)} }
    @keyframes glow { from{filter:drop-shadow(0 0 6px #f1c40f55)} to{filter:drop-shadow(0 0 18px #f1c40faa)} }
    .tcontent { position:relative; z-index:2; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:18px 12px; text-align:center; box-sizing:border-box; }
    .d20 { width:92px; height:92px; animation:spin20 9s linear infinite, glow 2.5s ease-in-out infinite alternate; }
    .tcontent h1 { font-family:Georgia,'Palatino Linotype',serif; font-size:clamp(34px,7vw,64px); margin:6px 0 0; letter-spacing:6px; font-variant:small-caps; color:#f6d365; background:linear-gradient(#fff3b0,#f1c40f 45%,#a8720a); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 3px 0 #3a2000) drop-shadow(0 0 22px #f1c40f66); }
    .orn { display:flex; align-items:center; justify-content:center; gap:10px; color:#c9a227; margin:4px 0 2px; font-size:14px; letter-spacing:4px; }
    .orn::before,.orn::after { content:''; height:2px; width:clamp(40px,12vw,140px); background:linear-gradient(90deg,transparent,#c9a227,transparent); }
    .tcontent h2 { margin:0 0 4px; color:#e8d9b0; font-weight:normal; font-style:italic; font-size:17px; }
    .tcontent .hero-h { margin:18px 0 10px; color:#ffe9a8; font-size:13px; letter-spacing:5px; text-transform:uppercase; }
    .slots { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; }
    .parch { position:relative; width:172px; padding:12px 10px 10px; border-radius:6px; color:#3b2610; background:radial-gradient(ellipse at 50% 30%,#f3e2b6,#d9bc82 80%,#b99556); border:3px solid #6b4a1e; box-shadow:0 0 0 2px #2a1a08,0 8px 20px #000a,inset 0 0 22px #8a6428aa; transition:transform .15s; }
    .parch:hover { transform:translateY(-4px) rotate(-.6deg); }
    .parch .pn { font-weight:700; font-size:16px; margin-top:4px; color:#2a1604; }
    .parch .pc { font-size:12px; color:#5a3e1a; font-style:italic; }
    .parch canvas { background:radial-gradient(#fff6,#0002); border-radius:50%; border:2px solid #6b4a1e; }
    .parch .sealc { position:absolute; top:-9px; right:-9px; width:28px; height:28px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#e04040,#7a0f0f); border:2px solid #4a0808; color:#ffd; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 4px #000a; }
    .parch.empty { background:rgba(20,14,34,.55); border:3px dashed #8a6a2a; color:#d8c48a; box-shadow:0 6px 16px #0008; min-height:176px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
    .parch button { background:#5a1f1f; border:2px solid #2a0a0a; color:#ffe9a8; font-family:inherit; }
    .parch button:hover:not(:disabled) { background:#7a2a2a; border-color:#c9a227; }
    .parch button.primary { background:#7a1f1f; border-color:#c9a227; }
    .onl { display:inline-flex; align-items:center; gap:8px; margin-top:18px; padding:7px 14px; border:2px solid #6b4a1e; border-radius:8px; background:rgba(20,14,34,.6); color:#f6d365; cursor:pointer; font-size:14px; }
    .onl small { color:#b9a97a; }
    .onl input { width:16px; height:16px; accent-color:#c9a227; }
    .tcredits { color:#b9a97a; font-size:11px; margin-top:26px; opacity:.8; }
    .create { width:min(1100px,96vw); max-height:96vh; overflow:auto; padding:14px; display:grid; grid-template-columns:1.3fr 1fr; gap:14px; }
    .create h3 { margin:6px 0; color:var(--gold); font-size:14px; text-transform:uppercase; letter-spacing:1px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:6px; }
    .card { padding:6px; border:2px solid var(--line); border-radius:5px; background:var(--panel2); cursor:pointer; font-size:12px; text-align:center; }
    .card.sel { border-color:var(--gold); background:#4a3a1f; }
    .card small { display:block; color:var(--dim); font-size:10px; }
    .swatches { display:flex; gap:6px; flex-wrap:wrap; }
    .sw { width:24px; height:24px; border:2px solid #000; border-radius:4px; cursor:pointer; }
    .sw.sel { outline:2px solid var(--gold); }
    input[type=text] { background:#0d0a14; color:var(--txt); border:2px solid var(--line); border-radius:5px; padding:8px; font:inherit; width:100%; }
    .preview { text-align:center; }
    .preview canvas { width:220px; height:220px; background:radial-gradient(circle at 50% 35%,#cfe9ff,#7fbf6a 80%); border:2px solid var(--line); border-radius:6px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin:8px 0; font-size:12px; }
    .stats div { background:var(--panel2); border-radius:4px; padding:4px; }
    .desc { font-size:12px; color:var(--dim); line-height:1.4; text-align:left; margin:6px 0; }
    #hud-tl { position:absolute; left:10px; top:10px; width:250px; padding:8px; display:grid; grid-template-columns:54px 1fr; gap:8px; }
    #hud-tl canvas { width:54px; height:54px; background:linear-gradient(#bfe3ff,#8fd07a); border-radius:4px; border:2px solid var(--line); }
    #hud-tr { position:absolute; right:10px; top:10px; text-align:right; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
    #zone { padding:6px 12px; font-size:13px; }
    #hud-tr .btns { display:flex; gap:6px; } #hud-tr .btns button { padding:4px 10px; font-size:12px; }
    #bossbar { position:absolute; left:50%; top:64px; transform:translateX(-50%); width:min(460px,70vw); padding:6px 10px; text-align:center; font-size:13px; z-index:5; }
    #bcn { font-size:11px; color:#ffd89a; margin-top:4px; }
    #target { position:absolute; left:50%; top:10px; transform:translateX(-50%); width:220px; padding:6px; text-align:center; font-size:12px; }
    #skills { position:absolute; left:50%; bottom:12px; transform:translateX(-50%); display:flex; gap:8px; padding:8px; }
    .slot { width:52px; height:52px; border:2px solid var(--line); border-radius:6px; background:var(--panel2); position:relative; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer; overflow:hidden; }
    .slot b { position:absolute; left:3px; top:1px; font-size:10px; color:var(--gold); }
    .slot em { position:absolute; right:3px; bottom:1px; font-size:10px; font-style:normal; }
    .slot .cd { position:absolute; left:0; right:0; bottom:0; background:#000a; height:0; }
    .slot.lock { opacity:.35; } .slot.nope { border-color:#a33; }
    #log { position:absolute; left:10px; bottom:10px; width:300px; max-height:140px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; font-size:12px; text-shadow:1px 1px #000; padding:6px; background:#0006; border-radius:6px; }
    #log div { margin-top:2px; }
    #chat { position:absolute; left:10px; bottom:-4px; width:312px; z-index:6; pointer-events:auto; padding:6px 8px; font-size:12px; }
    #chat.hidden { display:none; }
    .bubble { background:#fffbe8; color:#2a1a08; border:2px solid #6b4a1e; border-radius:8px; padding:3px 8px; font-size:12px; font-weight:normal; text-shadow:none; max-width:200px; white-space:normal; margin-bottom:3px; }
    #quests { width:230px; text-align:left; padding:8px; font-size:12px; }
    #quests h4 { margin:0 0 4px; color:var(--gold); }
    #prompt { position:absolute; left:50%; bottom:90px; transform:translateX(-50%); padding:6px 14px; font-size:13px; }
    .win { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:min(640px,94vw); max-height:88vh; overflow:auto; padding:12px; }
    .win h3 { margin:0 0 8px; color:var(--gold); display:flex; justify-content:space-between; align-items:center; }
    .grid { display:grid; grid-template-columns:repeat(6,1fr); gap:5px; }
    .it { aspect-ratio:1; border:2px solid #444; border-radius:5px; background:#15101f; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer; position:relative; }
    .it small { position:absolute; right:2px; bottom:0; font-size:9px; }
    .eq { display:flex; gap:8px; margin-bottom:10px; } .eq .it { width:64px; aspect-ratio:1; flex-direction:column; font-size:26px; }
    .eq .it small { position:static; font-size:9px; color:var(--dim); }
    .tip { margin-top:8px; padding:8px; background:var(--panel2); border-radius:5px; font-size:12px; min-height:70px; line-height:1.45; }
    .row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
    .qrow { background:var(--panel2); border-radius:5px; padding:8px; margin:6px 0; font-size:12px; }
    #toast { position:absolute; left:50%; top:30%; transform:translateX(-50%); font-size:30px; color:var(--gold); text-shadow:0 3px 0 #000; text-align:center; pointer-events:none; transition:opacity .6s; }
    #death { position:absolute; inset:0; background:#600a; display:flex; align-items:center; justify-content:center; font-size:38px; color:#fff; text-shadow:0 3px 0 #000; flex-direction:column; }
    #help { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); padding:14px; font-size:13px; line-height:1.7; width:min(460px,94vw); }
    .story-wrap { position:absolute; inset:0; background:#000b; display:flex; align-items:center; justify-content:center; z-index:50; }
    .story-box { width:min(580px,92vw); padding:24px 28px; font-size:15px; line-height:1.6; max-height:90vh; overflow:auto; }
    .story-box h2 { margin:2px 0 10px; color:var(--gold); text-shadow:0 2px 0 #000; }
    .story-box p { margin:8px 0; color:#e4ddf8; }
    .story-box .kick { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--dim); }

    /* ---- árvores, baús (gacha) ---- */
    .tree { display:flex; gap:8px; margin:8px 0; overflow-x:auto; }
    .tcol { flex:1; min-width:120px; display:flex; flex-direction:column; align-items:center; gap:4px; }
    .tcol h4 { margin:0 0 2px; font-size:12px; color:#ffe9a8; text-align:center; }
    .node { width:100%; box-sizing:border-box; background:var(--panel2); border:2px solid #4a4170; border-radius:6px; padding:5px 6px; font-size:11px; cursor:pointer; text-align:center; line-height:1.3; }
    .node b { display:block; font-size:12px; }
    .node.owned { border-color:#ffd23f; background:#3b3118; cursor:default; }
    .node.open { border-color:#7ee787; box-shadow:0 0 8px #7ee78766; }
    .node.nopoints { opacity:.75; }
    .node.locked { opacity:.4; cursor:default; }
    .arrow { color:#6b5f93; font-size:11px; line-height:1; }
    .tabs { display:flex; gap:6px; margin-bottom:6px; }
    .tabs button.on { background:#5a4a8f; border-color:#ffd23f; }
    .badge { display:inline-block; min-width:14px; padding:0 4px; border-radius:8px; background:#e0453d; color:#fff; font-size:10px; margin-left:3px; }
  </style>
</head>
<body>
  <div id="app">
    <div id="game"></div>
    <div id="ui"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
