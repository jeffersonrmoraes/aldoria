# Blueprint do Render: cria o servidor online do Reinos de Aldoria (plano gratuito).
services:
  - type: web
    name: aldoria-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AUTH_SECRET        # assina os logins; gerado pelo Render
        generateValue: true
      - key: DATABASE_URL       # Postgres gratuito (ex.: Neon): contas e personagens. Sem ele os dados somem quando o servidor dorme!
        sync: false
